<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEDE — NPNG Kumarhane</title>
<style>
  :root{
    --gold1:#f7d774; --gold2:#b8860b; --panel:#2a0a3a; --deep:#16041f;
    --ok:#34d399; --bad:#f87171;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
  html,body{height:100%;overflow:hidden}
  body{
    background:
      radial-gradient(1200px 500px at 50% -10%, #5b2a86 0%, transparent 60%),
      radial-gradient(900px 400px at 85% 110%, #8a5a00 0%, transparent 55%),
      linear-gradient(180deg,#1c0530 0%, #0d0216 100%);
    color:#fff; font-family:"Segoe UI",system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  #app{
    width:min(96vw,1000px); height:min(94vh,660px);
    display:grid; grid-template-columns:1fr 230px; grid-template-rows:auto 1fr auto auto;
    gap:10px; padding:14px; position:relative;
    background:linear-gradient(180deg,#31104a,#1a0526);
    border-radius:18px; box-shadow:0 0 0 3px var(--gold2), 0 0 40px rgba(247,215,116,.25), inset 0 0 60px rgba(0,0,0,.6);
  }
  #app.shake{animation:appshake .15s linear}
  @keyframes appshake{25%{transform:translate(4px,-2px)}50%{transform:translate(-4px,2px)}75%{transform:translate(2px,1px)}}
  header{grid-column:1/3; display:flex; align-items:center; justify-content:space-between; gap:10px}
  #title{
    font-size:34px; font-weight:900; letter-spacing:3px;
    background:linear-gradient(180deg,#fff6c8 0%, var(--gold1) 40%, var(--gold2) 75%, #6b4d00 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.8));
  }
  #title small{display:block; font-size:10px; letter-spacing:6px; color:#e8c96a; -webkit-text-fill-color:#e8c96a}
  .hbox{min-width:150px; padding:6px 14px; text-align:right; border-radius:10px; background:rgba(0,0,0,.45); border:1px solid rgba(247,215,116,.35)}
  .hbox b{display:block; font-size:10px; letter-spacing:2px; color:var(--gold1)}
  .hbox span{font-size:20px; font-weight:900; font-variant-numeric:tabular-nums}
  #credit{color:var(--gold1)} #lastWin{color:var(--ok)}
  /* ---------- makaralar ---------- */
  #stage{position:relative; grid-row:2; display:flex; align-items:stretch; justify-content:center}
  #reels{
    flex:1; max-width:660px; display:grid; gap:8px; padding:12px;
    grid-template-columns:repeat(6,1fr); grid-template-rows:repeat(5,1fr);
    background:linear-gradient(180deg,#4a1030,#2a0a20);
    border-radius:14px; border:2px solid rgba(247,215,116,.5);
    box-shadow:inset 0 0 30px rgba(0,0,0,.7);
    overflow:hidden; /* taşlar tahtanın üstünden düşüp altından çıkar (dönme yok — Berkan 2026-10-20) */
  }
  .cell{
    position:relative; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 35%, rgba(255,255,255,.08), rgba(0,0,0,.35));
    border-radius:10px; border:1px solid rgba(255,255,255,.06);
  }
  .cell svg{width:82%; height:82%; display:block; will-change:transform}
  .cell.scat{animation:scatpulse .5s ease-in-out 3; z-index:3}
  .cell.scat::after{content:""; position:absolute; inset:-2px; border-radius:12px; box-shadow:0 0 22px 6px rgba(255,120,200,.85), inset 0 0 14px rgba(255,220,240,.9)}
  @keyframes scatpulse{50%{transform:scale(1.18) rotate(-4deg)}}
  #fsbar{position:absolute; left:50%; top:4px; transform:translateX(-50%); z-index:7; display:none; gap:14px; align-items:center;
    background:linear-gradient(180deg,#7a1a5a,#3a0a2a); border:2px solid var(--gold1); border-radius:12px; padding:4px 14px;
    font-weight:900; font-size:15px; letter-spacing:1px; color:#fff; box-shadow:0 0 18px rgba(247,215,116,.6); white-space:nowrap}
  #fsbar.on{display:flex}
  #fsbar b{color:var(--gold1)} #fsbar i{font-style:normal; color:var(--ok)}
  #buyfs{line-height:1.15; min-width:196px; background:linear-gradient(180deg,#9a2a6a,#4a0a32); border:2px solid var(--gold1); color:#fff; box-shadow:0 0 14px rgba(255,120,200,.45)}
  #buyfs small{display:block; font-size:11px; color:var(--gold1); letter-spacing:.5px}
  #buyfs.arm{background:linear-gradient(180deg,#b01a1a,#5a0808); border-color:#ffb0b0; animation:armglow .6s ease-in-out infinite alternate}
  @keyframes armglow{to{box-shadow:0 0 26px 6px rgba(255,90,90,.85)}}
  @media (max-width:820px){ #buyfs{min-width:0; font-size:11px; padding:6px 8px} #title{font-size:26px} .hbox{min-width:0} }
  /* dar telefon (dikey): başlık iki satır, tahta ekrana sığar */
  @media (max-width:560px){ #app{grid-template-columns:minmax(0,1fr) !important; padding:8px; gap:6px; height:auto; min-height:min(94vh,660px)}
    header{flex-wrap:wrap; gap:6px} #title{font-size:22px} #title small{letter-spacing:3px}
    .hbox{padding:4px 8px} .hbox span{font-size:15px} #buyfs{order:9; flex:1 1 100%}
    #reels{gap:4px; padding:6px} footer{gap:6px} .btn{padding:7px 9px; font-size:12px} }
  .cell.win{animation:winpulse .55s ease-in-out 2; z-index:2}
  .cell.win::after{content:""; position:absolute; inset:0; border-radius:10px; box-shadow:0 0 18px 4px rgba(247,215,116,.9), inset 0 0 12px rgba(247,215,116,.8)}
  .cell.dim{opacity:.35; filter:saturate(.4)}
  .cell.struck{animation:struck .5s ease-out}
  @keyframes winpulse{50%{transform:scale(1.12)}}
  @keyframes struck{0%{filter:brightness(2.4)}100%{filter:none}}
  /* yildirim carpmasi */
  .bolt{position:absolute; width:6px; z-index:6; pointer-events:none; transform-origin:top center; animation:boltin .3s ease-out forwards}
  @keyframes boltin{0%{opacity:0; transform:scaleY(.1)}30%{opacity:1}100%{opacity:0; transform:scaleY(1)}}
  #winbar{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; pointer-events:none; opacity:0; transition:opacity .25s; z-index:5}
  #winbar.on{opacity:1}
  #winbar .amt{font-size:44px; font-weight:900; color:#fff; text-shadow:0 0 18px var(--gold1), 0 3px 6px #000; font-variant-numeric:tabular-nums}
  /* ---------- DEDE ---------- */
  #dede{grid-row:2; position:relative; display:flex; align-items:flex-end; justify-content:center}
  #dede .imgs{position:relative; width:100%; height:100%}
  #dede img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; transition:opacity .25s ease; filter:drop-shadow(0 0 14px rgba(247,215,116,.35))}
  #dede img.on{opacity:1}
  #dede.idle .imgs{animation:neefes 4.2s ease-in-out infinite}
  @keyframes neefes{50%{transform:translateY(-6px) scale(1.012)}}
  #dede.walk .imgs{animation:yuru 1.1s ease-in-out infinite}
  @keyframes yuru{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-16px) rotate(-1.2deg)}75%{transform:translateX(10px) rotate(1deg)}}
  #bubble{
    position:absolute; top:6px; left:-170px; width:180px; z-index:8;
    background:#fffbe8; color:#2a1608; font-size:12.5px; font-weight:600; line-height:1.35;
    padding:9px 11px; border-radius:12px; border:2px solid #c9a44a;
    opacity:0; transform:translateY(6px) scale(.94); transition:all .22s ease; pointer-events:none;
  }
  #bubble.on{opacity:1; transform:none}
  #bubble::after{
    content:""; position:absolute; right:-9px; top:26px; border:8px solid transparent; border-left-color:#c9a44a;
  }
  /* ---------- kontroller ---------- */
  footer{grid-column:1/3; display:flex; align-items:center; gap:10px; padding:4px 6px; flex-wrap:wrap}
  .ctl{background:rgba(0,0,0,.5); border:1px solid rgba(247,215,116,.3); border-radius:10px; padding:6px 10px; text-align:center}
  .ctl label{display:block; font-size:9px; letter-spacing:2px; color:var(--gold1)}
  .ctl span{font-size:18px; font-weight:900; font-variant-numeric:tabular-nums}
  .btn{cursor:pointer; border:1px solid rgba(247,215,116,.4); color:#ffe9a8; background:linear-gradient(180deg,#4a2a10,#2a1608); border-radius:10px; font-weight:800; font-size:13px; letter-spacing:1px; padding:9px 13px; transition:transform .08s, filter .15s}
  .btn:hover{filter:brightness(1.25)} .btn:active{transform:translateY(1px)}
  .btn.off{opacity:.4}
  .chk{display:flex; align-items:center; gap:6px; font-size:12px; color:#ffe9a8; cursor:pointer; padding:6px 8px; border:1px solid rgba(247,215,116,.3); border-radius:10px; background:rgba(0,0,0,.4)}
  .chk input{accent-color:#b8860b}
  #weekly{position:relative}
  #weekly .tag{position:absolute; top:-7px; right:-7px; background:var(--ok); color:#06281a; font-size:9px; font-weight:900; border-radius:8px; padding:1px 6px; display:none}
  #weekly.ready .tag{display:block}
  #spin{
    margin-left:auto; width:86px; height:86px; border-radius:50%;
    border:3px solid var(--gold1);
    background:radial-gradient(circle at 35% 30%, #ffe9a8, var(--gold1) 45%, var(--gold2) 80%);
    color:#3a2a00; font-size:15px; font-weight:900; letter-spacing:1px;
    box-shadow:0 0 22px rgba(247,215,116,.55), inset 0 -5px 8px rgba(0,0,0,.35);
    cursor:pointer; transition:transform .1s, box-shadow .2s;
  }
  #spin:hover{transform:scale(1.05)} #spin:active{transform:scale(.96)}
  #spin:disabled{filter:grayscale(.7) brightness(.6); cursor:default; transform:none}
  #msg{position:fixed; left:50%; bottom:14px; transform:translateX(-50%); background:rgba(0,0,0,.8); border:1px solid var(--gold2); color:var(--gold1); padding:8px 18px; border-radius:20px; font-size:13px; z-index:60; display:none}
  #bigwin{position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(0,0,0,.55); z-index:50}
  #bigwin.on{display:flex}
  #bw-title{font-size:min(11vw,84px); font-weight:900; letter-spacing:4px; text-align:center;
    background:linear-gradient(180deg,#fff 10%, var(--gold1) 45%, var(--gold2) 80%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 25px rgba(247,215,116,.9)) drop-shadow(0 4px 4px #000);
    animation:bwpop .5s cubic-bezier(.2,1.6,.4,1) backwards, bwshine 1.2s .5s infinite alternate ease-in-out}
  #bw-amt{margin-top:6px; font-size:min(7vw,52px); font-weight:900; color:var(--ok); text-shadow:0 0 20px rgba(52,211,153,.8), 0 3px 5px #000; font-variant-numeric:tabular-nums; animation:bwpop .5s .12s cubic-bezier(.2,1.6,.4,1) backwards}
  @keyframes bwpop{from{transform:scale(.2);opacity:0}}
  @keyframes bwshine{to{transform:scale(1.06)}}
  #fx{position:fixed; inset:0; pointer-events:none; z-index:49}
  @media (max-width:820px){ #app{grid-template-columns:1fr} #dede{display:none} #bubble{display:none} header,footer{grid-column:1} }
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="title">DEDE<small>NPNG KUMARHANE</small></div>
    <button class="btn" id="buyfs" title="10 bedava çevirme satın al (fiyat: 10 × bahis)">BEDAVA ÇEVİRME AL<small id="buyfs-p">₺10.000</small></button>
    <div class="hbox"><b>BAKİYE</b><span id="credit">0</span></div>
    <div class="hbox"><b>SON KAZANÇ</b><span id="lastWin">0</span></div>
  </header>

  <div id="stage">
    <div id="reels"></div>
    <div id="fsbar"><span>BEDAVA ÇEVİRME <b id="fs-n">1/10</b></span><span>ÇARPAN <b id="fs-g">×1</b></span><span>TOPLAM <i id="fs-t">₺0</i></span></div>
    <div id="winbar"><div class="amt" id="win-amt"></div></div>
  </div>

  <div id="dede" class="idle">
    <div class="imgs">
      <img id="dede-a" class="on" alt="" src="taht.webp">
      <img id="dede-b" alt="" src="">
    </div>
    <div id="bubble"></div>
  </div>

  <footer>
    <div class="ctl"><label>BAHİS</label><span id="bet-v">1.000</span></div>
    <button class="btn" id="bet-minus">−</button>
    <button class="btn" id="bet-plus">+</button>
    <button class="btn" id="turbo">TURBO</button>
    <button class="btn" id="sound">SES: AÇIK</button>
    <label class="chk"><input type="checkbox" id="voice" checked>Dedenin sesi</label>
    <label class="chk"><input type="checkbox" id="fxreduce">Efektleri azalt</label>
    <button class="btn" id="auto">OTO: KAPALI</button>
    <button class="btn" id="weekly">HAFTALIK BONUS<span class="tag" id="weekly-tag">HAZIR</span></button>
    <button id="spin">ÇEVİR</button>
  </footer>
  <div style="grid-column:1/3;text-align:center;font-size:11px;letter-spacing:1px;color:#c9a44a;opacity:.85">Sanal para ile oynanır — gerçek para değeri yoktur.</div>
</div>

<div id="bigwin"><div id="bw-title"></div><div id="bw-amt"></div></div>
<canvas id="fx"></canvas>
<div id="msg"></div>

<script>
'use strict';
/* =====================================================================
   DEDE — NPNG Kumarhane slotu (tek dosya, bağımlılıksız)
   - Çekirdek bölümü DOM'suzdur: node ile NPNG_CASINO.simulate() test edilebilir.
   - PARA: sayfa para EKLEMEZ/kalıcı tutmaz; bakiye her zaman oyun gelir
     (NPNG_CASINO.setCredit). Sayfa yalnızca olay bildirir:
     onBet(miktar), onWin(miktar). claimWeeklyBonus() oyun hesaplar.
   ===================================================================== */

/* ---------------- RNG ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rng=Math.random;

/* ---------------- ÇEKİRDEK: semboller & ödeme tablosu ---------------- */
const SYM={
  blue:  {w:12, pay:[0.4,0.8,1.5]},
  green: {w:12, pay:[0.5,1.2,2.0]},
  yellow:{w:10, pay:[0.6,1.4,2.5]},
  purple:{w:9,  pay:[0.8,1.8,3.2]},
  red:   {w:8,  pay:[1.0,2.0,4.0]},
  cup:   {w:8,  pay:[1.5,3.0,6.0]},
  ring:  {w:7,  pay:[2.0,4.0,8.0]},
  hour:  {w:6,  pay:[3.0,6.0,12.0]},
  crown: {w:5,  pay:[5.0,10.0,25.0]},
};
const ORB_VALUES=[2,3,4,5,10,25,50,100];
const ROWS=5,COLS=6,N=ROWS*COLS;
const SCATTER='scatter',ORB='orb';
const POOL=[];for(const k in SYM)POOL.push([k,SYM[k].w]);
POOL.push([SCATTER,0.5],[ORB,1]);
const POOL_W=POOL.reduce((s,e)=>s+e[1],0);

function pickSym(){let r=rng()*POOL_W;for(const[k,w]of POOL){if((r-=w)<0)return k}return 'blue'}
/* düşüşle gelen yeni taşlarda çarpan küresi olmaz: çarpan yalnız ilk tahtadakilerden sayılır (cascade), ekranda sayılmayan küre görünmesin */
function pickRefill(){let s;do{s=pickSym()}while(s===ORB);return s}
function genBoard(){const b=new Array(N);for(let i=0;i<N;i++){const s=pickSym();b[i]=s===ORB?{o:ORB_VALUES[Math.floor(rng()*ORB_VALUES.length)]}:s}return b}

/* kategori tablosu — RTP hedefi ~%96 (simülasyonla doğrulanır, %95-97 bandı) */
const CATS=[
  ['near', 0.110,  null,                0   ],
  ['small',0.117,  ()=>0.4+rng()*1.6,   0   ],
  ['big',  0.011,  ()=>2+rng()*13,      0.15],
  ['mega', 0.0038, ()=>15+rng()*35,     0.15],
  ['epic', 0.0008, ()=>50+rng()*150,    0.15],
  ['leg',  0.00015,()=>250+rng()*500,   0.20],
  ['jack', 0.00002,()=>1500+rng()*1500, 0.25],
  ['fs',   0.0024, null,                1   ], /* yalnız 4 dede donu: bedava çevirme (ara sıra, Berkan) */
  ['loss', 0,      null,                0   ],
];
CATS[CATS.length-1][1]=1-CATS.slice(0,-1).reduce((s,c)=>s+c[1],0);
/* Yapay "kıl payı kaçırma" — CONFIG.nearMiss ile açılır, VARSAYILAN KAPALI
   (karar Berkan'a ait). Kapalıyken near olasılığını loss absorbe eder;
   doğal oyun sonuçlarından hiçbirini değiştirmez. */
const CONFIG={nearMiss:false,
  WEEKLY:{rate:0.10,cap:25000}, // haftalık kayıp bonusu: 7 günlük net kaybın %10'u, tavan 25.000 (Berkan değiştirebilir)
};
function catProb(c){
  if(c[0]==='near')return CONFIG.nearMiss?c[1]:0;
  if(c[0]==='loss'&&!CONFIG.nearMiss){const n=CATS.find(x=>x[0]==='near');return c[1]+(n?n[1]:0)}
  return c[1];
}
/* Bedava çevirme (Berkan 2026-10-20): ekrana aynı anda 4+ DEDE DONU (scatter) düşerse 10 bedava çevirme;
   ya da "BEDAVA ÇEVİRME AL": fiyat = 10 × bahis, 10 çevirme. Satın alınan turun ortalaması fiyatının ~%96'sı
   (normal oyunla aynı geri ödeme) olacak şekilde simülasyonla ayarlıdır — doğal tur daha cömerttir, satın alınan
   tur bedavaya para basmaz. Kapı: tests/casino-rtp.cjs (her iki RTP %95-97). */
const FS={spins:10,retrig:5,buyCost:10,
  natural:{pw:0.30,po:0.10},
  bought:{pw:0.30,po:0.0171}}; /* po: 200 bin satın almalık simülasyonla ~%96 */
function drawCat(){const w=CATS.map(catProb);const tw=w.reduce((s,x)=>s+x,0);let r=rng()*tw;
  for(let i=0;i<CATS.length;i++){if((r-=w[i])<0)return CATS[i]}return CATS[CATS.length-1]}

/* ---------------- ÇEKİRDEK: tahta müdahale ---------------- */
function pickGem(ex){const ks=Object.keys(SYM).filter(k=>k!==ex);return ks[Math.floor(rng()*ks.length)]}
function clearSym(board,sym){for(let i=0;i<N;i++)if(board[i]===sym)board[i]=pickGem(sym)}
function clearOrbs(board){for(let i=0;i<N;i++)if(typeof board[i]==='object'&&board[i])board[i]=pickGem()}
function plant(board,sym,count){let n=0;while(n<count){const i=Math.floor(rng()*N);if(board[i]===sym)continue;board[i]=sym;n++}}
function plantOrbs(board,sum){
  clearOrbs(board);
  let s=0,guard=0;
  while(s<sum&&guard++<60){
    const v=ORB_VALUES[Math.floor(rng()*ORB_VALUES.length)];
    if(s+v>sum*1.35)continue;
    const free=[];for(let i=0;i<N;i++){const c=board[i];if(c!=='crown'&&c!==SCATTER&&typeof c!=='object')free.push(i)}
    if(!free.length)break;
    board[free[Math.floor(rng()*free.length)]]={o:v};s+=v;
  }
  return s;
}
function plantScatters(board,count){clearSym(board,SCATTER);let n=0;while(n<count){const i=Math.floor(rng()*N);if(board[i]===SCATTER)continue;board[i]=SCATTER;n++}}
function forceWin(board,target){
  const capped=Math.min(target,5000);
  if(capped<2.2){
    const pick=capped<0.5?['blue',8]:capped<0.9?['green',8]:capped<1.3?['red',8]:capped<1.8?['cup',8]:['ring',8];
    clearOrbs(board);clearSym(board,pick[0]);plant(board,pick[0],pick[1]);return;
  }
  clearSym(board,'crown');clearOrbs(board);
  const cnt=8+Math.floor(rng()*3);
  const base=SYM.crown.pay[cnt>=10?1:0];
  const m=Math.max(1,Math.round(capped/base));
  plant(board,'crown',cnt);
  plantOrbs(board,m);
}
function plantNear(board){clearOrbs(board);clearSym(board,'crown');plant(board,'crown',7)}

/* ---------------- ÇEKİRDEK: değerlendirme + düşürme ---------------- */
function evaluate(board){
  const counts={};for(const s of board){if(typeof s==='string'&&s!==SCATTER)counts[s]=(counts[s]||0)+1}
  const wins=[];for(const k in counts){if(counts[k]>=8){const p=SYM[k].pay;wins.push({sym:k,count:counts[k],pay:p[counts[k]>=12?2:counts[k]>=10?1:0]})}}
  let orbSum=0;for(const s of board)if(typeof s==='object'&&s)orbSum+=s.o;
  let scat=0;for(const s of board)if(s===SCATTER)scat++;
  return {wins,orbSum,scat};
}
function dropRefill(board){
  const b=board.slice();
  for(let c=0;c<COLS;c++){
    const col=[];for(let r=0;r<ROWS;r++){const v=b[r*COLS+c];if(v!==null)col.push(v)}
    while(col.length<ROWS)col.unshift(pickRefill());
    for(let r=0;r<ROWS;r++)b[r*COLS+c]=col[r];
  }
  return b;
}
function orbCells(board){const o=[];for(let i=0;i<N;i++)if(typeof board[i]==='object'&&board[i])o.push({i,v:board[i].o});return o}
function cascade(board){
  let cur=board.slice(),base=0,orbTotal=0;const steps=[];
  const first=evaluate(cur);
  orbTotal+=first.orbSum;
  steps.push({type:'board',board:cur.slice(),orbs:orbCells(cur)});
  for(let g=0;g<12;g++){
    const ev=evaluate(cur);
    if(ev.wins.length===0)break;
    const pay=ev.wins.reduce((s,w)=>s+w.pay,0);
    base+=pay;
    const cells=new Set();ev.wins.forEach(w=>{for(let i=0;i<N;i++)if(cur[i]===w.sym)cells.add(i)});
    steps.push({type:'win',pay,cells:[...cells]});
    const nxt=cur.slice();cells.forEach(i=>nxt[i]=null);
    cur=dropRefill(nxt);
    steps.push({type:'drop',board:cur.slice(),orbs:orbCells(cur)});
  }
  return {base,orbSum:orbTotal,scat:first.scat,steps};
}

/* ---------------- ÇEKİRDEK: bir spin ---------------- */
function runSpin(bet,inBonus,fm){
  let board=genBoard(),bonusTrig=false,catName=inBonus?'bonus':'loss';
  if(!inBonus){
    const cat=drawCat();catName=cat[0];
    if(cat[0]==='near')plantNear(board);
    else if(cat[0]==='fs'){clearOrbs(board);plantScatters(board,4);bonusTrig=true}
    else if(cat[2]){
      if(rng()<cat[3]){plantScatters(board,4);bonusTrig=true}
      else forceWin(board,cat[2]());
    }
    else clearOrbs(board);
  }else{
    fm=fm||FS.natural;
    if(rng()<fm.pw)forceWin(board,0.5+rng()*1.5);
    if(rng()<fm.po)plantOrbs(board,2+Math.floor(rng()*10));
    else clearOrbs(board);
  }
  const res=cascade(board);
  if(!inBonus&&res.scat>=4&&!bonusTrig)bonusTrig=true;
  const win=Math.min(res.base*(1+res.orbSum),5000);
  if(typeof DBG!=='undefined'&&!inBonus){DBG.byCat[catName]=DBG.byCat[catName]||{n:0,win:0};DBG.byCat[catName].n++;DBG.byCat[catName].win+=win}
  return {board,res,win,bonusTrig};
}
function runBonus(bet,bought){
  const fm=bought?FS.bought:FS.natural;
  let spins=FS.spins,total=0,glob=1,log=[],extra=0;
  while(spins-->0&&log.length<60){
    const r=runSpin(bet,true,fm);
    glob+=Math.min(r.res.orbSum,10);
    const w=r.res.base*glob;
    total+=w;
    const re=r.res.scat>=3;if(re){spins+=FS.retrig;extra+=FS.retrig}
    log.push({win:w,glob,res:r.res,board:r.board,retrig:re});
  }
  return {total:Math.min(total,5000),log,spins:FS.spins+extra};
}

function simulate(n){
  let bet=1,spent=0,won=0,bonusHits=0,maxWin=0,wins=0;
  for(let i=0;i<n;i++){
    spent+=bet;
    const r=runSpin(bet,false);

    fctx.globalAlpha=Math.max(p.life,0);fctx.fillStyle=p.c;fctx.beginPath();fctx.arc(p.x,p.y,p.r,0,7);fctx.fill()}

  if(!el||typeof el.animate!=='function'||reduceMotion)return;
  const k=from<to?[{transform:`translateY(${from}px)`},{transform:`translateY(${to}px)`}]
    :[{transform:`translateY(${from}px)`},{transform:`translateY(${to+Math.min(6,-from*.04)}px)`,offset:.84},{transform:`translateY(${to}px)`}];
  el.animate(k,{duration:dur,delay,easing:ease||'cubic-bezier(.55,0,1,.45)',fill:fill||'backwards'});
}
async function dropOut(T){
  const P=pitch(),dur=T?140:230;let mx=0;
  for(let i=0;i<N;i++){const r=Math.floor(i/COLS),c=i%COLS,dl=c*(T?14:28)+(ROWS-1-r)*(T?10:20);mx=Math.max(mx,dl);
    animY(svgOf(i),0,(ROWS-r)*P+P*.3,dur,dl,'cubic-bezier(.55,0,1,.45)','forwards')}
  await sleep(mx+dur+10);
}
async function dropIn(board,T){
  paint(board);
  const P=pitch(),dur=T?230:380,cs=T?30:55,rs=T?22:42;let mx=0;
  for(let i=0;i<N;i++){const r=Math.floor(i/COLS),c=i%COLS,dl=c*cs+(ROWS-1-r)*rs;mx=Math.max(mx,dl);animY(svgOf(i),-ROWS*P-P*.2,0,dur,dl,'ease-in')}
  for(let c=0;c<COLS;c++)setTimeout(()=>sfx.tick(),c*cs+dur);
  await sleep(mx+dur+20);
}
/* kazanan taşlar patlar; üstteki taşlar boşluğa kayar, yeni taşlar yukarıdan gelir (yalnız değişen sütun parçaları hareket eder) */
async function popCells(cells,T){
  for(const i of cells){const el=svgOf(i);if(el&&typeof el.animate==='function'&&!reduceMotion)el.animate([{transform:'scale(1)',opacity:1},{transform:'scale(1.25)',opacity:1,offset:.35},{transform:'scale(0)',opacity:0}],{duration:T?140:230,fill:'forwards'})}
  await sleep(T?150:240);
}
async function cascadeDrop(board,removed,T){
  paint(board);
  const P=pitch(),dur=T?200:320,rm=new Set(removed||[]);let mx=0;
  for(let c=0;c<COLS;c++){
    const gone=[],keep=[];for(let r=0;r<ROWS;r++)(rm.has(r*COLS+c)?gone:keep).push(r);
    const n=gone.length;if(!n)continue;
    for(let j=0;j<ROWS;j++){
      const i=j*COLS+c;
      if(j<n){const dl=60+(n-1-j)*(T?22:40)+c*(T?8:15);mx=Math.max(mx,dl);animY(svgOf(i),-(n+.2)*P,0,dur,dl,'ease-in')}
      else{const from=keep[j-n],d=(j-from)*P;if(d>0)animY(svgOf(i),-d,0,dur,c*(T?8:15),'ease-in')}
    }
  }
  await sleep(mx+dur+20);
}
/* çarpan küreleri: ilk tahtadakiler sayılır (aynı nesneler düşüşte yer değiştirir); kazanç varsa en sonda çakar */
function liveOrbs(res,board){
  const first=res.steps[0]&&res.steps[0].board;if(!first||!board)return [];
  const set=new Set(first.filter(x=>typeof x==='object'&&x));
  const o=[];for(let i=0;i<N;i++)if(set.has(board[i]))o.push({i,v:board[i].o});return o;
}
async function strikeOrbs(orbs,T){
  for(const o of orbs){strikeCell(o.i,o.v);if(!carpanQuipped){carpanQuipped=true;quip('carpan')}await sleep(T?90:180)}
}

async function spin(){
  if(spinning)return;
  if(credit<bet){showMsg(external?'Yetersiz bakiye!':'Yetersiz bakiye! Zombi moduna dönüp para kas. (demo)');autoStop();return}
  spinning=true;$('spin').disabled=true;buyBtn();
  dedePose('spin');
  addCredit(-bet);
  betListeners.forEach(f=>{try{f(bet)}catch(e){}});
  if(!external)flowLog.push({t:Date.now(),bet,win:0});
  $('lastWin').textContent='0';$('winbar').classList.remove('on');
  const T=turboRef.on;
  audio();
  quip('spin');
  try{
  const r=runSpin(bet,false);
  carpanQuipped=false;
  await dropOut(T);
  await dropIn(r.res.steps[0].board,T);
  await playSteps(r.res,T);
  if(r.res.base>0){const fin=lastBoard(r.res.steps);await strikeOrbs(liveOrbs(r.res,fin),T)}
  finishWin(r.win);
  if(r.bonusTrig){await showDons(T);await bonusFlow(false)}
  lossStreak=r.win>0||r.bonusTrig?0:lossStreak+1;
  if(r.win<=0&&!r.bonusTrig){
    if(lossStreak>=3||bet>=10000){dedePose('buyuk',3400);quip('buyuk-kayip')}
    else{dedePose('kayip',2600);quip('kayip')}
  }
  }catch(err){
    console.error('spin hatasi:',err);
  }finally{
    spinning=false;$('spin').disabled=false;buyBtn();
  }
  if(autoOn&&autoLeft>0){autoLeft--;if(autoLeft<=0)autoStop();await sleep(T?120:400);if(autoOn)spin()}
}
function lastBoard(steps){for(let i=steps.length-1;i>=0;i--)if(steps[i].type==='drop'||steps[i].type==='board')return steps[i].board;return null}
async function playSteps(res,T){
  let removed=null;
  for(const st of res.steps){
    if(st.type==='drop'&&st.board){await cascadeDrop(st.board,removed,T);removed=null}
    else if(st.type==='win'){
      cellEls.forEach((c,i)=>{if(st.cells.includes(i)){c.classList.add('win')}else{c.classList.add('dim')}});
      $('winbar').classList.add('on');$('win-amt').textContent='₺'+fmt(st.pay*bet);
      sfx.coin(3);
      await sleep(T?260:520);
      cellEls.forEach(c=>c.classList.remove('win','dim'));
      $('winbar').classList.remove('on');
      await popCells(st.cells,T);removed=st.cells;
    }
  }
  $('winbar').classList.remove('on');
}
function finishWin(winMult){
  if(winMult<=0)return;
  const amount=winMult*bet;
  addCredit(amount);
  winListeners.forEach(f=>{try{f(amount)}catch(e){}});
  if(!external)flowLog.push({t:Date.now(),bet:0,win:amount});
  dedePose('kazanc',2600);
  $('lastWin').textContent='₺'+fmt(amount);
  $('winbar').classList.add('on');countUp($('win-amt'),amount,turboRef.on?400:900);
  setTimeout(()=>$('winbar').classList.remove('on'),turboRef.on?600:1400);
  sfx.coin(Math.log2(amount+1));
  quip('kazanc');
  if(winMult>=15)bigWinShow(tierOf(winMult),amount);
}
/* 4+ dede donu: donlar parlar, dede kızar */
async function showDons(T){
  cellEls.forEach(c=>{if(c.querySelector('text')&&c.textContent.includes('DON'))c.classList.add('scat')});
  sfx.bonus();quip('don');dedePose('kazanc',2600);
  showMsg('👙 4 DEDE DONU! 10 BEDAVA ÇEVİRME');
  await sleep(T?900:1700);
  cellEls.forEach(c=>c.classList.remove('scat'));
}
async function bonusFlow(bought){
  const T=turboRef.on,bar=$('fsbar');
  const b=runBonus(bet,bought);let paid=0,k=0;
  if(!bought)showMsg('⚡ 10 BEDAVA ÇEVİRME BAŞLIYOR!');
  sfx.bonus();
  const upd=(g)=>{$('fs-n').textContent=Math.min(k,b.spins)+'/'+b.spins;$('fs-g').textContent='×'+fmt(g);$('fs-t').textContent='₺'+fmt(paid*bet)};
  k=1;upd(1);bar.classList.add('on');
  let g0=1;
  for(const t of b.log){
    upd(g0);
    carpanQuipped=false;
    await dropOut(T);
    await dropIn(t.res.steps[0].board,T);
    await playSteps(t.res,T);
    const orbs=liveOrbs(t.res,lastBoard(t.res.steps));
    if(orbs.length){await strikeOrbs(orbs,T);upd(t.glob);$('fs-g').animate&&$('fs-g').animate([{transform:'scale(1.8)'},{transform:'scale(1)'}],{duration:350})}
    g0=t.glob;
    const w=Math.max(0,Math.min(t.win,b.total-paid));paid+=w; /* toplam 5000x tavanını aşma */
    if(w>0){
      addCredit(w*bet);winListeners.forEach(f=>{try{f(w*bet)}catch(e){}});
      if(!external)flowLog.push({t:Date.now(),bet:0,win:w*bet});
      $('lastWin').textContent='₺'+fmt(w*bet);
      $('winbar').classList.add('on');$('win-amt').textContent='₺'+fmt(w*bet);sfx.coin(5);
      await sleep(T?260:600);$('winbar').classList.remove('on');
    }
    if(t.retrig){showMsg('👙 +'+FS.retrig+' BEDAVA ÇEVİRME!');sfx.bonus();await sleep(T?300:700)}
    k++;upd(g0);
    await sleep(T?80:220);
  }
  bar.classList.remove('on');
  const tot=b.total*bet;
  $('lastWin').textContent='₺'+fmt(tot);
  if(b.total>=15)bigWinShow(tierOf(b.total),tot);
  else{showMsg('Bedava çevirme bitti: ₺'+fmt(tot));sfx.coin(8)}
  if(tot>0){dedePose('kazanc',2600);quip('kazanc')}else{dedePose('kayip',2600);quip('kayip')}
}
/* --- bedava çevirme satın al: fiyat 10 × bahis, iki kez bas (yanlışlıkla büyük harcama olmasın) --- */
let buyArmT=0;
function buyBtn(){const b=$('buyfs');if(!b)return;b.disabled=spinning;b.classList.toggle('off',spinning);if(spinning||Date.now()>buyArmT){b.classList.remove('arm');b.firstChild.textContent='BEDAVA ÇEVİRME AL'}}
async function buyFS(){
  if(spinning)return;
  const price=FS.buyCost*bet;
  if(credit<price){showMsg('Yetersiz bakiye! 10 bedava çevirme ₺'+fmt(price)+' (10 × bahis)');return}
  if(Date.now()>buyArmT){buyArmT=Date.now()+3500;const b=$('buyfs');b.classList.add('arm');b.firstChild.textContent='EMİN MİSİN? TEKRAR BAS';setTimeout(buyBtn,3600);return}
  buyArmT=0;autoStop();
  spinning=true;$('spin').disabled=true;buyBtn();
  addCredit(-price);
  betListeners.forEach(f=>{try{f(price)}catch(e){}});
  if(!external)flowLog.push({t:Date.now(),bet:price,win:0});
  $('lastWin').textContent='0';audio();
  const T=turboRef.on;
  try{
    quip('satin');dedePose('spin');
    await dropOut(T);
    const bd=genBoard();for(let i=0;i<N;i++)if(bd[i]===SCATTER||(typeof bd[i]==='object'&&bd[i]))bd[i]='blue';
    const sp=[];while(sp.length<4){const i=Math.floor(Math.random()*N);if(!sp.includes(i))sp.push(i)}for(const i of sp)bd[i]=SCATTER;
    await dropIn(bd,T);
    cellEls.forEach((c,i)=>{if(sp.includes(i))c.classList.add('scat')});sfx.bonus();
    showMsg('👙 10 BEDAVA ÇEVİRME SATIN ALINDI (₺'+fmt(price)+')');
    await sleep(T?700:1400);cellEls.forEach(c=>c.classList.remove('scat'));
    await bonusFlow(true);
  }catch(err){console.error('satın alma hatası:',err)}
  finally{spinning=false;$('spin').disabled=false;buyBtn()}
}
function autoStop(){autoOn=false;autoLeft=0;$('auto').textContent='OTO: KAPALI';$('spin').classList.remove('auto-on')}

/* ---------------- haftalık bonus arayüzü ---------------- */
async function weeklyClick(){
  const btn=$('weekly');
  if(btn.disabled)return;
  btn.disabled=true;
  try{
    const r=await API.claimWeeklyBonus();
    if(r&&r.amount>0){
      quip('haftalik');
      showMsg('Haftalık bonus: ₺'+fmt(r.amount));
    }else{
      showMsg(r&&r.reason==='already-claimed'?'Bu haftanın bonusu alındı.':r&&r.reason==='offline'?'Çevrimdışısın: bonus yok (ilerleme kaydedilmez).':'Henüz bonus yok (son 7 günde net kayıp yok).');
    }
  }catch(e){showMsg('Bonus şu anda alınamıyor.')}
  btn.disabled=false;
  weeklyRefresh();
}
function weeklyRefresh(){
  const btn=$('weekly');
  if(external){ // oyun hesaplar ve durumu bildirir
    const st=typeof API.weeklyStatus==='function'?API.weeklyStatus():'';
    btn.classList.toggle('ready',st==='ready');
    $('weekly-tag').textContent=st==='ready'?'HAZIR':st==='claimed'?'ALINDI':st==='offline'?'ÇEVRİMDIŞI':'YOK';
    return;
  }
  const week=isoWeek(new Date());
  const claimable=!demoStore.get('weekly_'+week,false);
  btn.classList.toggle('ready',claimable);
  $('weekly-tag').textContent=claimable?'HAZIR':'ALINDI';
}

/* ---------------- olaylar ---------------- */
if(typeof document!=='undefined'){
  dedePose('idle');idleLoop();
  $('spin').addEventListener('click',()=>{if(autoOn){autoStop();return}audio();spin()});
  $('auto').addEventListener('click',()=>{
    if(autoOn){autoStop();return}
    autoOn=true;autoLeft=50;$('auto').textContent='OTO: 50';audio();spin();
  });
  /* Claude entegrasyonu: bahis basamakları 10 TL'den başlar (oyunda yeni hesap 31 TL) */
  const stepBet=d=>{let i=0;for(let k=0;k<BETS.length;k++)if(BETS[k]<=bet)i=k;bet=BETS[Math.max(0,Math.min(BETS.length-1,i+d))];if(!external)demoStore.set('bet',bet);renderCredit()};
  $('bet-plus').addEventListener('click',()=>stepBet(1));
  $('bet-minus').addEventListener('click',()=>stepBet(-1));
  $('turbo').addEventListener('click',()=>{turboRef.on=!turboRef.on;$('turbo').classList.toggle('off',!turboRef.on)});
  $('sound').addEventListener('click',()=>{soundOn=!soundOn;$('sound').textContent='SES: '+(soundOn?'AÇIK':'KAPALI')});
  $('voice').addEventListener('change',e=>{
    voiceOn=e.target.checked;
    if(!voiceOn){speechSynthesis&&speechSynthesis.cancel();quip('ses-kapali')} // ses-kapali balonda görünür, ses çıkmaz
  });
  $('fxreduce').addEventListener('change',e=>{fxReduce=e.target.checked;$('dede').classList.toggle('idle',!fxReduce)});
  $('weekly').addEventListener('click',weeklyClick);
  $('buyfs').addEventListener('click',()=>{audio();buyFS()});
  $('turbo').classList.add('off');
  voiceOn=true;$('voice').checked=true;
  weeklyRefresh();
  buildGrid();renderCredit();
}

/* ---------------- dışa açık API ---------------- */
const API={
  get credit(){return credit},
  getCredit:()=>credit,
  setCredit,                       // oyun bağlanır: bakiye her zaman oyundan
  addCredit,                       // demo/geri uyumluluk; oyunda kullanma
  getBet:()=>bet,
  setBet:v=>{bet=Math.max(10,Math.round(v));if(typeof document!=='undefined')renderCredit()},
  onChange:f=>listeners.push(f),
  onBet:f=>betListeners.push(f),   // her spin başında bet miktarıyla çağrılır
  onWin:f=>winListeners.push(f),   // her kazançta tutarla çağrılır
  claimWeeklyBonus:demoClaimWeekly, // oyun kendi hesabıyla BUNU DEĞİŞTİRECEK
  weeklyStatus:null,               // oyun bağlar: ()=>'ready'|'claimed'|'none'|'offline'
  stopAuto:()=>autoStop(),         // oyun kumarhaneden çıkınca çağırır
  get spinning(){return spinning},
  simulate,
  simulateBuy,
  buyCost:()=>FS.buyCost*bet,
  seed:s=>{rng=mulberry32(s)},
  unseed:()=>{rng=Math.random},
  config:{get rtpTarget(){return 0.96},
          get nearMiss(){return CONFIG.nearMiss},
          set nearMiss(v){CONFIG.nearMiss=!!v},
          WEEKLY:CONFIG.WEEKLY},
  _core:{FS,runSpin,runBonus,cascade,evaluate,genBoard,CATS,DBG,forceWin,plantOrbs,plantNear,orbCells},
  _ui:{dedePose,bubble,quip,strikeCell,buyFS,dropIn}, // entegrasyon/ekran testi kancalari
};
if(typeof window!=='undefined')window.NPNG_CASINO=API;
if(typeof document!=='undefined')document.dispatchEvent(new CustomEvent('npng-casino-ready'));
