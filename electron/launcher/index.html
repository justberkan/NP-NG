<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>NPNG — Sunucu seç</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><span class="eyebrow">MASAÜSTÜ İSTEMCİSİ</span><h1>N.P.N.G.</h1><p>No Pain No Gain</p></header>
<form id="server-form"><h2>Oyuna bağlan</h2><div class="choices"><label><input type="radio" name="server" value="local" checked> Bu bilgisayardaki oyun</label><label><input type="radio" name="server" value="remote"> İnternet / arkadaş linki</label></div>
<label class="address" for="address">Sunucu adresi</label><input id="address" name="address" type="url" value="http://localhost:3000/" autocomplete="url" spellcheck="false" required maxlength="2048">
<p id="hint">Önce oyun klasöründeki SUNUCU-BASLAT.bat dosyasını aç.</p><button id="connect" type="submit">BAĞLAN VE OYNA <span>→</span></button><p id="status" role="status" aria-live="polite"></p></form>
<footer><span>F11: tam ekran · Ctrl+W: sunucu seçimine dön</span><small id="version"></small></footer></main><script src="launcher.js"></script></body></html>
